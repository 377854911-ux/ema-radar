<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/app.css"></head><body><div class="page"><div class="top"><h1>行情扫描设置</h1><a class="btn secondary" href="../pages/scanner.html">返回</a></div><div class="panel"><form id="form"><label>扫描周期<select name="timeframe"><option>15m</option><option>30m</option><option>1h</option><option>2h</option><option>4h</option><option>6h</option><option>8h</option><option>12h</option><option>1d</option></select></label><label>扫描数量<input name="limit" type="number" value="100" min="1" max="100"></label><button>保存设置</button></form><p id="msg" class="muted"></p></div></div><script>const form=document.querySelector('#form');const k='ema.settings.scanner';const old=JSON.parse(localStorage.getItem(k)||'{}');for(const e of form.elements){if(e.name&&old[e.name]!==undefined)e.value=old[e.name]}form.onsubmit=e=>{e.preventDefault();const v={};for(const el of form.elements)if(el.name)v[el.name]=el.value;localStorage.setItem(k,JSON.stringify(v));document.querySelector('#msg').textContent='已保存在当前浏览器';};</script></body></html>
