<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/app.css"></head><body><div class="page"><div class="top"><h1>行情回测</h1><a class="btn secondary" href="../settings/backtest.html">⚙ 设置</a></div><div class="panel bt-controls"><style>.bt-field{display:flex;align-items:center;gap:10px;margin:12px 0}.bt-field>span{flex:0 0 76px;white-space:nowrap}.bt-field>select,.bt-field>input{flex:1;min-width:0;width:100%;margin:0}.bt-periods{margin:12px 0}.bt-period-title{font-weight:600;margin-bottom:9px}.bt-tfs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.bt-tfs label{position:relative;display:block;margin:0;min-width:0;cursor:pointer}.bt-tfs input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}.bt-tfs label span{display:flex;justify-content:center;align-items:center;min-height:38px;border:1px solid #4c6481;border-radius:8px;font-size:13px;background:#0b1424;color:#edf3ff}.bt-tfs input:checked+span{background:#2868bb;border-color:#4b96ee;color:white}.bt-tfs input:focus-visible+span{outline:2px solid #80baff;outline-offset:2px}@media(max-width:390px){.bt-field{gap:8px}.bt-field>span{flex-basis:70px}.bt-tfs{gap:5px}}.bt-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.bt-stat{background:#0b1424;border:1px solid #405570;border-radius:10px;padding:12px;min-width:0}.bt-stat-label{font-size:13px;color:#aebdd2;margin-bottom:7px}.bt-stat-value{font-size:20px;font-weight:700;overflow-wrap:anywhere}.page{padding:8px 12px}.top{margin-bottom:3px}.top h1{font-size:19px;margin:5px 0}.panel{padding:10px 12px;margin:7px 0}.bt-field{margin:5px 0;gap:7px}.bt-field>select,.bt-field>input{min-height:34px;height:34px;padding:4px 8px;font-size:16px}.bt-periods{margin:7px 0}.bt-period-title{font-size:14px;margin-bottom:5px}.bt-tfs{gap:4px}.bt-tfs label span{min-height:30px;font-size:12px}.bt-controls .row{margin-top:8px}.bt-controls button{padding:7px 12px;font-size:14px}.bt-controls #status{margin:6px 0 0;font-size:12px;line-height:1.3;max-height:2.6em;overflow:auto}.bt-result h3{font-size:17px;margin:2px 0 6px}.bt-stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:6px 0}.bt-stat{padding:7px 5px;border-radius:7px}.bt-stat-label{font-size:11px;margin-bottom:3px}.bt-stat-value{font-size:15px}.bt-result #summary{font-size:11px!important;line-height:1.3!important;max-height:2.6em;overflow:auto;margin-top:5px!important}.bt-result #rrDisplay,.bt-result #actualRR{display:inline-block;font-size:11px!important;margin:3px 9px 0 0!important}.bt-details{padding:9px 12px}.bt-details>summary{cursor:pointer;font-weight:600;font-size:14px}.bt-details #tradeResults{max-height:55dvh;overflow:auto;margin-top:8px}@media(max-height:680px){.page{padding:5px 9px}.panel{padding:7px 9px;margin:5px 0}.bt-field{margin:3px 0}.bt-tfs label span{min-height:27px}.bt-stat{padding:5px 4px}.bt-controls #status{max-height:1.3em}}</style><label class="bt-field"><span>历史天数</span><select id="days"><option value="7">7天</option><option value="30" selected>30天</option><option value="60">60天</option></select></label><label class="bt-field"><span>扫描范围</span><select id="scope"><option value="market">历史每日前100（逐币种模拟试算）</option><option value="single">单交易对核验</option></select></label><label id="symbolField" class="bt-field"><span>交易对</span><input id="symbol" value="BTCUSDT" autocomplete="off" spellcheck="false"></label><label class="bt-field"><span>盈亏比</span><select id="rr"><option value="0.8">1:0.80</option><option value="0.9">1:0.90</option><option value="1">1:1.00</option><option value="1.1">1:1.10</option><option value="1.2">1:1.20</option><option value="1.3">1:1.30</option><option value="1.4">1:1.40</option><option value="1.5">1:1.50</option><option value="1.6">1:1.60</option><option value="1.7">1:1.70</option><option value="1.8">1:1.80</option><option value="1.9">1:1.90</option><option value="2">1:2.00</option><option value="3">1:3.00</option><option value="4">1:4.00</option><option value="5">1:5.00</option><option value="6">1:6.00</option><option value="7">1:7.00</option><option value="8">1:8.00</option><option value="9">1:9.00</option><option value="10">1:10.00</option></select></label><div class="bt-periods"><div class="bt-period-title">扫描周期（可多选）</div><div id="tfChoices" class="bt-tfs"><label><input type="checkbox" name="tf" value="15m"><span>15m</span></label><label><input type="checkbox" name="tf" value="30m"><span>30m</span></label><label><input type="checkbox" name="tf" value="1h"><span>1h</span></label><label><input type="checkbox" name="tf" value="2h"><span>2h</span></label><label><input type="checkbox" name="tf" value="4h"><span>4h</span></label><label><input type="checkbox" name="tf" value="6h"><span>6h</span></label><label><input type="checkbox" name="tf" value="8h"><span>8h</span></label><label><input type="checkbox" name="tf" value="12h"><span>12h</span></label><label><input type="checkbox" name="tf" value="1d"><span>1d</span></label></div></div><div class="row"><button id="start">开始回测</button><button id="stop" class="secondary">停止</button></div><div id="btProgress" hidden style="margin:7px 0"><div id="btProgressText" class="muted" style="font-size:12px;margin-bottom:4px">准备扫描</div><div style="height:9px;background:#253a56;border-radius:8px;overflow:hidden"><div id="btProgressFill" role="progressbar" aria-label="回测扫描进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="height:100%;width:0%;background:#4b96ee;transition:width .2s"></div></div></div><p id="status" class="muted">等待扫描</p></div><div class="panel bt-result"><h3>回测结果</h3><div class="bt-stats"><div class="bt-stat"><div class="bt-stat-label">交易笔数</div><div id="tradeCount" class="bt-stat-value">—</div></div><div class="bt-stat"><div class="bt-stat-label">胜率</div><div id="winRate" class="bt-stat-value">—</div></div><div class="bt-stat"><div class="bt-stat-label">总盈利</div><div id="grossProfit" class="bt-stat-value">—</div></div><div class="bt-stat"><div class="bt-stat-label">总亏损</div><div id="grossLoss" class="bt-stat-value">—</div></div><div class="bt-stat"><div class="bt-stat-label">净盈亏</div><div id="netProfit" class="bt-stat-value">—</div></div><div class="bt-stat"><div class="bt-stat-label">收益率</div><div id="returnPct" class="bt-stat-value">—</div></div></div><div id="summary" class="muted" style="font-size:13px;line-height:1.6;margin:12px 0 0">尚未开始回测</div><div id="rrDisplay" class="muted" style="margin:6px 0;font-size:13px">盈亏比：读取设置中…</div><div id="actualRR" class="muted" style="margin:6px 0;font-size:13px">实际平均盈亏比：尚未计算</div></div><details class="panel bt-details"><summary>逐笔交易盈亏明细（点击展开）</summary><div id="tradeResults" class="muted">扫描完成后显示每笔已平仓交易</div></details><div hidden aria-hidden="true"><span id="count">0</span><div id="results"></div></div></div><script src="../js/backtest-universe.js"></script><script src="../js/backtest-sim.js"></script><script src="../js/backtest-portfolio.js"></script><script src="../js/backtest-signal.js"></script></body></html>
