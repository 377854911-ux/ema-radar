<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>EMA 雷达设置</title>
<style>
:root{color-scheme:dark;--panel:#121d2e;--line:#26364d;--text:#edf3fb;--muted:#9aabc0}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 14px 28px}main{max-width:760px;margin:auto}.top{padding:22px 2px 14px}.top a{color:#9fc2ff;text-decoration:none;font-size:13px;font-weight:700}.title{font-size:24px;font-weight:800;margin:12px 0 6px}.muted{color:var(--muted);font-size:12px;line-height:1.6}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:14px;margin:12px 0}.heading{font-size:15px;font-weight:800;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.grid label{font-size:11px;color:var(--muted)}input[type=number],select{width:100%;margin-top:5px;padding:10px 7px;background:#0b1422;color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:15px}.periods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.period{background:#0b1422;border:1px solid var(--line);border-radius:9px;padding:10px 8px;font-size:12px;color:var(--text)}.period input{accent-color:#2ecc8b;margin-right:5px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;background:#2e6ed0;color:white;padding:12px 16px;font-weight:800;text-decoration:none}.btn.secondary{background:#26364d;color:var(--text)}.status{font-size:12px;color:#2ecc8b;margin-top:10px}.note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px}@media(max-width:390px){.grid{gap:6px}.grid label{font-size:10px}.periods{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main>
<header class="top"><a href="./index.html">← 返回 EMA 雷达主页</a><div class="title">EMA 模型设置</div><div class="muted">这里只保留 EMA25/50/100 参数、扫描周期、提醒铃声和自动扫描间隔。</div></header>
<section class="panel"><div class="heading">EMA 模型参数</div><div class="muted">多头：EMA快线高于中线、中线高于慢线，三条EMA同时位于同一根阳线实体内。空头条件完全相反。参数只作用于 EMA 模型。</div><div class="grid">
<label>EMA 快线<input type="number" id="emaFast" min="1" max="150" value="25"></label><label>EMA 中线<input type="number" id="emaMid" min="2" max="150" value="50"></label><label>EMA 慢线<input type="number" id="emaSlow" min="3" max="150" value="100"></label>
</div></section>
<section class="panel"><div class="heading">扫描时间周期（多选）</div><div class="muted">选择要扫描的周期；支持15分钟、30分钟、1小时至1天。</div><div class="periods" id="periods">
<label class="period"><input type="checkbox" value="15m" data-period>15分钟</label><label class="period"><input type="checkbox" value="30m" data-period>30分钟</label><label class="period"><input type="checkbox" value="1h" data-period>1小时</label><label class="period"><input type="checkbox" value="2h" data-period>2小时</label><label class="period"><input type="checkbox" value="4h" data-period>4小时</label><label class="period"><input type="checkbox" value="6h" data-period>6小时</label><label class="period"><input type="checkbox" value="8h" data-period>8小时</label><label class="period"><input type="checkbox" value="12h" data-period>12小时</label><label class="period"><input type="checkbox" value="1d" data-period>1天</label>
</div></section>
<section class="panel"><div class="heading">提醒铃声</div><div class="muted">EMA 多头或空头出现新信号时提醒。提醒总开关也可在主页面控制。</div><div class="grid" style="grid-template-columns:1fr"><label>铃声样式<select id="soundTone"><option value="double">清脆双音（默认）</option><option value="short">短促提示音</option><option value="long">长音提醒</option></select></label></div><div class="actions"><button class="btn secondary" id="previewSound">试听铃声</button><button class="btn secondary" id="soundToggle">开启提醒</button></div><div class="status" id="soundStatus"></div></section>
<section class="panel"><div class="heading">自动扫描间隔</div><div class="muted">每轮扫描完成后，等待所设时间再开始下一轮。</div><div class="grid" style="grid-template-columns:1fr"><label>扫描间隔（分钟）<input id="autoMinutes" type="number" min="1" max="1440" step="1" value="30"></label></div>
<div class="actions"><button class="btn" id="save">保存所有设置</button><button class="btn secondary" id="reset">恢复默认参数</button><a class="btn secondary" href="./index.html">返回扫描页面</a></div><div class="status" id="status"></div><div class="note">已移除大模型和 MA 模型。主页面与回测页面只使用 EMA 模型。</div>
</section></main>
<script>
const $=id=>document.getElementById(id),DEFAULT_EMA=[25,50,100],PERIODS=['15m','30m','1h','2h','4h','6h','8h','12h','1d'];
function fill(){let saved;try{saved=JSON.parse(localStorage.getItem('simpleRadarIndicatorParams')||'null');}catch(e){}const ema=Array.isArray(saved?.ema)&&saved.ema.length===3?saved.ema:DEFAULT_EMA;['emaFast','emaMid','emaSlow'].forEach((id,i)=>$(id).value=ema[i]);let periods;try{periods=JSON.parse(localStorage.getItem('emaRadarIntervals')||'null');}catch(e){}if(!Array.isArray(periods)||!periods.length)periods=PERIODS;document.querySelectorAll('[data-period]').forEach(x=>x.checked=periods.includes(x.value));$('autoMinutes').value=localStorage.getItem('emaRadarAutoInterval')||'30';}
function validTriple(a){return a.every(v=>Number.isInteger(v)&&v>=1&&v<=150)&&a[0]<a[1]&&a[1]<a[2];}
$('save').onclick=()=>{const ema=[$('emaFast').value,$('emaMid').value,$('emaSlow').value].map(Number),minutes=Number($('autoMinutes').value),periods=[...document.querySelectorAll('[data-period]:checked')].map(x=>x.value);if(!validTriple(ema)||!Number.isInteger(minutes)||minutes<1||minutes>1440||!periods.length){$('status').textContent='保存失败：请检查EMA参数顺序，并至少选择一个周期；扫描间隔须为1–1440分钟。';return;}try{localStorage.setItem('simpleRadarIndicatorParams',JSON.stringify({ema}));localStorage.setItem('emaRadarIntervals',JSON.stringify(PERIODS.filter(p=>periods.includes(p))));localStorage.setItem('emaRadarAutoInterval',String(minutes));$('status').textContent='EMA参数、扫描周期和自动扫描间隔已保存。返回主页面即可生效。';}catch(e){$('status').textContent='保存失败：浏览器暂不允许写入本地设置。';}};
$('reset').onclick=()=>{localStorage.setItem('simpleRadarIndicatorParams',JSON.stringify({ema:DEFAULT_EMA}));localStorage.setItem('emaRadarIntervals',JSON.stringify(PERIODS));localStorage.setItem('emaRadarAutoInterval','30');fill();$('status').textContent='已恢复 EMA 25/50/100、全部9个周期和30分钟扫描间隔。';};
function playPreview(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){$('soundStatus').textContent='当前浏览器不支持音频播放。';return;}const ctx=new AC(),tone=$('soundTone').value,patterns={short:[{d:0,f:880,t:.16}],double:[{d:0,f:784,t:.16},{d:.22,f:1046,t:.16}],long:[{d:0,f:880,t:.48}]};if(ctx.state==='suspended')ctx.resume();(patterns[tone]||patterns.double).forEach(p=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=p.f;g.gain.setValueAtTime(.0001,ctx.currentTime+p.d);g.gain.exponentialRampToValueAtTime(.16,ctx.currentTime+p.d+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+p.d+p.t);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+p.d);o.stop(ctx.currentTime+p.d+p.t+.02);});$('soundStatus').textContent='正在试听所选铃声。';setTimeout(()=>ctx.close(),1000);}
$('soundTone').value=localStorage.getItem('emaRadarSoundTone')||'double';$('soundToggle').textContent=localStorage.getItem('emaRadarSoundEnabled')==='true'?'关闭提醒':'开启提醒';$('soundTone').addEventListener('change',()=>{localStorage.setItem('emaRadarSoundTone',$('soundTone').value);$('soundStatus').textContent='铃声选择已保存。';});$('previewSound').addEventListener('click',playPreview);$('soundToggle').addEventListener('click',()=>{const on=localStorage.getItem('emaRadarSoundEnabled')==='true';localStorage.setItem('emaRadarSoundEnabled',String(!on));$('soundToggle').textContent=!on?'关闭提醒':'开启提醒';$('soundStatus').textContent=!on?'EMA模型提醒已开启。':'EMA模型提醒已关闭。';});fill();
</script></body></html>
