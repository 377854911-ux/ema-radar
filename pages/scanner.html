<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/app.css"></head><body><div class="page"><div class="top"><h1>行情扫描</h1><a class="btn secondary" href="../settings/scanner.html">⚙ 设置</a></div><p class="muted">Binance USDⓈ-M · 公开行情 · 当前未收盘K线三线穿实体预警</p><div class="panel"><div style="margin-bottom:12px"><strong>扫描周期（可多选）</strong><div id="timeframeChoices" style="margin-top:8px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px"></div></div><div class="row" style="align-items:center;margin-bottom:12px"><label style="margin:0;display:flex;align-items:center;gap:6px"><input id="autoScan" type="checkbox" style="width:20px;height:20px;min-height:20px">自动扫描</label><label style="margin:0">间隔 <select id="scanInterval"><option value="5">5分钟</option><option value="10">10分钟</option><option value="15">15分钟</option><option value="30">30分钟</option><option value="60">60分钟</option></select></label></div><div class="row"><button id="scan">开始扫描</button><button id="stop" class="secondary">停止</button><label class="check" style="display:inline-flex;align-items:center;margin:0 0 0 4px;gap:7px"><input id="soundToggle" type="checkbox" style="width:20px;height:20px;min-height:20px">🔔 声音提醒</label></div><p id="status" class="muted">等待扫描</p><div style="height:9px;background:#0b1220;border-radius:8px;overflow:hidden" role="progressbar" aria-label="扫描进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack"><div id="progressFill" style="height:100%;width:0%;background:#4c9fff;transition:width .15s"></div></div></div><div class="panel"><h3>扫描结果</h3><div id="results" class="muted">尚无结果</div></div></div><script src="../js/scanner.js"></script></body></html>
