<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../css/app.css"><style>body{padding-bottom:90px}h2{font-size:16px;margin:24px 0 12px;color:#a9cbff}fieldset{border:1px solid #35506d;border-radius:10px;margin:14px 0;padding:10px}legend{font-size:14px}.chip{display:inline-flex;align-items:center;gap:5px;background:#1d3450;border-radius:8px;padding:9px;margin:4px;font-size:13px}.check{display:flex;gap:10px;align-items:center}input[type=checkbox]{accent-color:#4c9fff;width:17px;height:17px}input[type=number],select{display:block;width:100%;margin-top:6px}.bar{position:fixed;bottom:0;left:0;right:0;padding:12px;background:#0b1220;border-top:1px solid #304866}.bar button{width:100%}</style></head><body><div class="page"><div class="top"><h1>自动交易设置</h1><a class="btn secondary" href="../pages/trading.html">返回</a></div><p class="muted">所有参数可独立修改并保存到当前设备。尚未接入的功能只保存配置，不会假装已经生效。</p><form id="form"><h2>实盘开仓参数（仅保存配置，未启用下单）</h2><fieldset><legend>自动交易周期（可多选）</legend><label class="chip"><input type="checkbox" name="timeframes" value="15m" checked> 15m</label><label class="chip"><input type="checkbox" name="timeframes" value="30m" checked> 30m</label><label class="chip"><input type="checkbox" name="timeframes" value="1h" checked> 1h</label><label class="chip"><input type="checkbox" name="timeframes" value="2h" checked> 2h</label><label class="chip"><input type="checkbox" name="timeframes" value="4h" checked> 4h</label><label class="chip"><input type="checkbox" name="timeframes" value="6h" checked> 6h</label><label class="chip"><input type="checkbox" name="timeframes" value="8h" checked> 8h</label><label class="chip"><input type="checkbox" name="timeframes" value="12h" checked> 12h</label><label class="chip"><input type="checkbox" name="timeframes" value="1d" checked> 1d</label></fieldset><label>每笔名义金额(USDT)<input name="orderUSDT" type="number" value="1000" min="1" max="100000000" step="any" required></label><label>杠杆倍数<input name="leverage" type="number" value="1" min="1" max="10" step="any" required></label><label>保证金模式<select name="marginMode"><option value="isolated" selected>逐仓</option><option value="cross" >全仓</option></select></label><label>最大持仓及有效入场挂单数<input name="maxPositions" type="number" value="5" min="1" max="100" step="any" required></label><label>自动扫描间隔(分钟)<input name="interval" type="number" value="15" min="1" max="1440" step="any" required></label><label class="check"><input type="checkbox" name="closeScan" checked> 周期收盘时立即扫描</label><h2>开仓与出场</h2><label>入场限价方式<select name="entryMode"><option value="next_open" selected>下一根开盘价</option><option value="offset" >下一根开盘价偏移</option></select></label><label>限价偏移(%)<input name="entryOffset" type="number" value="0.5" min="0.5" max="10" step="0.5" required></label><label>止损方式<select name="stopMode"><option value="signal_open" selected>信号K线开盘价</option><option value="signal_extreme" >信号K线极值</option><option value="hard_percent" >固定百分比</option></select></label><label>硬止损(%)<input name="hardStop" type="number" value="2" min="1" max="10" step="any" required></label><label>固定盈亏比<select name="rr"><option value="0.8" >0.8</option><option value="0.9" >0.9</option><option value="1" selected>1</option><option value="1.1" >1.1</option><option value="1.2" >1.2</option><option value="1.3" >1.3</option><option value="1.4" >1.4</option><option value="1.5" >1.5</option><option value="1.6" >1.6</option><option value="1.7" >1.7</option><option value="1.8" >1.8</option><option value="1.9" >1.9</option><option value="2" >2</option><option value="3" >3</option><option value="4" >4</option><option value="5" >5</option><option value="6" >6</option><option value="7" >7</option><option value="8" >8</option><option value="9" >9</option><option value="10" >10</option></select></label><label>持仓K线数<input name="holdCandles" type="number" value="12" min="1" max="100" step="any" required></label><h2>连续止损调整</h2><label>每次止损后加仓基数(%)<input name="lossStep" type="number" value="10" min="0" max="100" step="any" required></label><label>加仓上限(%)<input name="lossCap" type="number" value="50" min="0" max="500" step="any" required></label><h2>通知与警报</h2><fieldset><legend>普通交易通知（可多选）</legend><label class="chip"><input type="checkbox" name="events" value="entry" checked> 开仓成交</label><label class="chip"><input type="checkbox" name="events" value="tp" checked> 止盈成交</label><label class="chip"><input type="checkbox" name="events" value="sl" checked> 止损成交</label><label class="chip"><input type="checkbox" name="events" value="time" checked> 时间到期平仓</label></fieldset><fieldset><legend>普通交易声音（可多选）</legend><label class="chip"><input type="checkbox" name="sounds" value="entry" checked> 开仓成交</label><label class="chip"><input type="checkbox" name="sounds" value="tp" checked> 止盈成交</label><label class="chip"><input type="checkbox" name="sounds" value="sl" checked> 止损成交</label><label class="chip"><input type="checkbox" name="sounds" value="time" checked> 时间到期平仓</label></fieldset><label>未确认警报重复间隔(秒)<input name="alertRepeat" type="number" value="30" min="5" max="3600" step="any" required></label><label>通知历史保留天数<input name="alertRetention" type="number" value="30" min="1" max="365" step="any" required></label><label>交易历史保留天数<input name="tradeRetention" type="number" value="90" min="1" max="365" step="any" required></label><h2>策略资金统计</h2><label>自定义初始资金(USDT)<input name="initialCapital" type="number" value="10000" min="1" max="100000000" step="any" required></label><fieldset><legend>盈亏统计周期筛选（可多选）</legend><label class="chip"><input type="checkbox" name="statsTimeframes" value="15m" checked> 15m</label><label class="chip"><input type="checkbox" name="statsTimeframes" value="30m" checked> 30m</label><label class="chip"><input type="checkbox" name="statsTimeframes" value="1h" checked> 1h</label><label class="chip"><input type="checkbox" name="statsTimeframes" value="2h" checked> 2h</label><label class="chip"><input type="checkbox" name="statsTimeframes" value="4h" checked> 4h</label><label class="chip"><input type="checkbox" name="statsTimeframes" value="6h" checked> 6h</label><label class="chip"><input type="checkbox" name="statsTimeframes" value="8h" checked> 8h</label><label class="chip"><input type="checkbox" name="statsTimeframes" value="12h" checked> 12h</label><label class="chip"><input type="checkbox" name="statsTimeframes" value="1d" checked> 1d</label></fieldset><div class="bar"><button type="submit">保存全部设置</button></div></form><p id="status" role="status"></p></div><script>const k='ema.settings.trading',form=document.querySelector('#form'),status=document.querySelector('#status');try{const saved=JSON.parse(localStorage.getItem(k)||'{}');for(const el of form.querySelectorAll('[name]')){if(!(el.name in saved))continue;if(el.type==='checkbox')el.checked=Array.isArray(saved[el.name])?saved[el.name].includes(el.value):!!saved[el.name];else el.value=saved[el.name]}}catch(e){status.textContent='读取旧设置失败，请重新保存'}form.addEventListener('submit',e=>{e.preventDefault();const data={};for(const el of form.querySelectorAll('[name]')){if(el.type==='checkbox'){if(el.closest('fieldset')){if(!data[el.name])data[el.name]=[];if(el.checked)data[el.name].push(el.value)}else data[el.name]=el.checked}else data[el.name]=el.type==='number'?Number(el.value):el.value}try{localStorage.setItem(k,JSON.stringify(data));status.textContent='已保存 '+new Date().toLocaleString('zh-CN')}catch(e){status.textContent='保存失败：'+e.message}});</script></body></html>
