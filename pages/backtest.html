<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/app.css"></head><body><div class="page"><div class="top"><h1>行情回测</h1><a class="btn secondary" href="../settings/backtest.html">⚙ 设置</a></div><div class="panel"><h3>第二阶段 · 历史EMA信号与盈亏模拟</h3><p class="muted">真实币安历史K线；只识别已收盘信号K线，并显示紧接着下一根K线开盘参考价。可模拟下一根开盘入场、止盈止损、手续费与盈亏。历史每日前100、资金费率、挂单偏移和完整风控仍未实现；仅供单交易对验证，不是完整市场回测。</p><label>交易对（逐个核验）<input id="symbol" value="BTCUSDT" autocomplete="off" spellcheck="false"></label><label>扫描周期<select id="tf"><option>15m</option><option>30m</option><option>1h</option><option>2h</option><option>4h</option><option>6h</option><option>8h</option><option>12h</option><option>1d</option></select></label><label>历史天数<select id="days"><option value="7">7天</option><option value="30" selected>30天</option><option value="60">60天</option></select></label><div class="row"><button id="start">开始历史信号扫描</button><button id="stop" class="secondary">停止</button></div><p id="status" class="muted">等待扫描</p></div><div class="panel"><h3>盈亏比与模拟交易统计</h3><div id="rrDisplay" style="font-size:19px;font-weight:700;margin:10px 0">目标盈亏比：读取设置中…</div><div id="actualRR" style="font-size:19px;font-weight:700;margin:10px 0">实际平均盈亏比：尚未计算</div><div id="summary" class="muted">扫描结束后计算；资金费率开启时不会生成不完整的盈亏数字。</div><a class="btn secondary" href="../settings/backtest.html">检查盈亏比及资金费率设置</a></div><div class="panel"><h3>逐笔交易盈亏明细</h3><div id="tradeResults" class="muted">扫描完成后显示每笔已平仓交易</div></div><div class="panel"><h3>已发现信号：<span id="count">0</span></h3><div id="results" class="muted">尚无结果</div></div></div><script src="../js/backtest-sim.js"></script><script src="../js/backtest-signal.js"></script></body></html>
