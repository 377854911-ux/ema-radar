<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../css/app.css"><title>K线反转扫描</title><style>.mini{font-size:12px;color:#a3b6cf}.choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.choices label{margin:0;text-align:center;background:#20334d;border-radius:8px;padding:7px 2px;font-size:12px}.choices input{width:15px;min-height:15px;height:15px;vertical-align:middle}.setting{display:grid;grid-template-columns:1fr 1fr;gap:10px}.setting label{margin:6px 0;font-size:13px}.setting input{width:100%}.signal{border:1px solid #385574;border-radius:10px;padding:12px;margin:10px 0}.signal .meta{font-size:12px;color:#b5c7df;line-height:1.8}.bull{color:#ff6676}.bear{color:#35d49c}.pill{font-size:11px;padding:3px 7px;border-radius:10px;background:#334965}.row{align-items:center}.row label{margin:3px 0}button{font-size:14px}.panel{padding:13px}.progress{height:8px;background:#0b1220;border-radius:8px;overflow:hidden}.progress div{height:100%;background:#4c9fff;width:0%}</style></head><body><div class="page"><div class="top"><h1>K线反转扫描</h1><span class="mini">独立扫描窗口</span></div><p class="muted">连续两根反向大实体K线 · 红涨绿跌 · 未收盘预警，收盘确认</p><div class="panel"><strong>扫描市场与范围</strong><div class="setting"><label><input id="cryptoOn" type="checkbox" checked> 加密货币合约<input id="cryptoCount" type="number" min="1" max="1000" value="100" step="1" aria-label="加密货币成交额前N名"></label><label><input id="tradOn" type="checkbox" checked> 传统金融合约<input id="tradCount" type="number" min="1" max="1000" value="50" step="1" aria-label="传统金融成交额前N名"></label></div><p class="mini">两个市场分别按24小时成交额排序，数量独立设置。仅扫描可交易合约。</p><strong>两根K线最低实体幅度</strong><div class="setting"><label>第一根（%）<input id="firstPct" type="number" min="0.01" max="1000" step="0.1" value="3"></label><label>第二根（%）<input id="secondPct" type="number" min="0.01" max="1000" step="0.1" value="2"></label></div><p class="mini">不要求吞没，不限制影线与跳空；两根实体方向必须相反。</p><strong>扫描周期（多选）</strong><div id="periods" class="choices" style="margin:9px 0 14px"></div><div class="row"><label><input type="checkbox" id="changeOn" checked> 24小时涨跌幅过滤</label><label>上限 ± <input id="changePct" type="number" min="0.01" max="10000" step="0.5" value="30" style="width:75px"> %</label></div><p class="mini">超过阈值排除；排除观察标签、即将下架及暂停交易合约。</p><div class="row"><label><input id="autoOn" type="checkbox"> 自动扫描</label><label>间隔 <input id="interval" type="number" min="10" max="3600" value="60" style="width:75px"> 秒</label><label><input id="soundOn" type="checkbox" checked> 🔔 铃声</label></div><div class="row"><button id="scan">开始扫描</button><button id="stop" class="secondary">停止</button><button id="save" class="secondary">保存设置</button><button id="test" class="secondary">试听</button></div><p id="status" class="muted">等待扫描</p><div class="progress"><div id="bar"></div></div></div><div class="panel"><div class="top"><h3>反转信号</h3><span id="counter" class="mini">0条</span></div><div id="results" class="muted">尚无信号</div></div></div><script src="../js/reversal-scanner.js"></script></body></html>
