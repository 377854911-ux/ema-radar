<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../css/app.css"><style>body{padding-bottom:90px}h2{font-size:16px;margin:24px 0 12px;color:#a9cbff}fieldset{border:1px solid #35506d;border-radius:10px;margin:14px 0;padding:10px}legend{font-size:14px}.chip{display:inline-flex;align-items:center;gap:5px;background:#1d3450;border-radius:8px;padding:9px;margin:4px;font-size:13px}.check{display:flex;gap:10px;align-items:center}input[type=checkbox]{accent-color:#4c9fff;width:17px;height:17px}input[type=number],select{display:block;width:100%;margin-top:6px}.bar{position:fixed;bottom:0;left:0;right:0;padding:12px;background:#0b1220;border-top:1px solid #304866}.bar button{width:100%}</style></head><body><div class="page"><div class="top"><h1>行情扫描设置</h1><a class="btn secondary" href="../pages/scanner.html">返回</a></div><p class="muted">所有参数可独立修改并保存到当前设备。尚未接入的功能只保存配置，不会假装已经生效。</p><form id="form"><h2>市场与周期</h2><fieldset><legend>扫描周期（可多选）</legend><label class="chip"><input type="checkbox" name="timeframes" value="15m" checked> 15m</label><label class="chip"><input type="checkbox" name="timeframes" value="30m" checked> 30m</label><label class="chip"><input type="checkbox" name="timeframes" value="1h" checked> 1h</label><label class="chip"><input type="checkbox" name="timeframes" value="2h" checked> 2h</label><label class="chip"><input type="checkbox" name="timeframes" value="4h" checked> 4h</label><label class="chip"><input type="checkbox" name="timeframes" value="6h" checked> 6h</label><label class="chip"><input type="checkbox" name="timeframes" value="8h" checked> 8h</label><label class="chip"><input type="checkbox" name="timeframes" value="12h" checked> 12h</label><label class="chip"><input type="checkbox" name="timeframes" value="1d" checked> 1d</label></fieldset><label>24小时成交额排名前N<input name="topN" type="number" value="100" min="1" max="300" step="any" required></label><label>24小时绝对涨跌幅过滤(%)<input name="maxMove" type="number" value="30" min="0" max="100" step="any" required></label><label class="check"><input type="checkbox" name="excludeObservation" checked> 过滤观察标签</label><label class="check"><input type="checkbox" name="excludeDelist" checked> 过滤即将下架交易对</label><h2>EMA模型</h2><label>EMA快线<input name="emaFast" type="number" value="25" min="1" max="300" step="any" required></label><label>EMA中线<input name="emaMid" type="number" value="50" min="1" max="300" step="any" required></label><label>EMA慢线<input name="emaSlow" type="number" value="100" min="1" max="500" step="any" required></label><fieldset><legend>扫描方向（可多选）</legend><label class="chip"><input type="checkbox" name="directions" value="long" checked> 多头</label><label class="chip"><input type="checkbox" name="directions" value="short" checked> 空头</label></fieldset><p class="muted">行情扫描只预警当前未收盘K线：EMA25、EMA50、EMA100必须全部穿过同一根阳线或阴线实体；接近条件不预警。自动交易另行使用收盘确认。</p><label>结果排序<select name="ranking"><option value="time_cluster_volume" selected>时间优先→聚拢度→成交额</option><option value="cluster" >EMA聚拢度</option><option value="time" >时间到期平仓</option><option value="volume" >成交额</option></select></label><h2>扫描与提醒</h2><label>自动扫描间隔(分钟)<input name="interval" type="number" value="15" min="1" max="1440" step="any" required></label><label class="check"><input type="checkbox" name="closeScan" checked> 每个选中周期收盘时扫描</label><label class="check"><input type="checkbox" name="sound" checked> 声音提醒</label><label class="check"><input type="checkbox" name="notify" checked> 系统通知</label><div class="bar"><button type="submit">保存全部设置</button></div></form><p id="status" role="status"></p></div><script>const k='ema.settings.scanner',form=document.querySelector('#form'),status=document.querySelector('#status');try{const saved=JSON.parse(localStorage.getItem(k)||'{}');for(const el of form.querySelectorAll('[name]')){if(!(el.name in saved))continue;if(el.type==='checkbox')el.checked=Array.isArray(saved[el.name])?saved[el.name].includes(el.value):!!saved[el.name];else el.value=saved[el.name]}}catch(e){status.textContent='读取旧设置失败，请重新保存'}form.addEventListener('submit',e=>{e.preventDefault();const data={};for(const el of form.querySelectorAll('[name]')){if(el.type==='checkbox'){if(el.closest('fieldset')){if(!data[el.name])data[el.name]=[];if(el.checked)data[el.name].push(el.value)}else data[el.name]=el.checked}else data[el.name]=el.type==='number'?Number(el.value):el.value}try{localStorage.setItem(k,JSON.stringify(data));status.textContent='已保存 '+new Date().toLocaleString('zh-CN')}catch(e){status.textContent='保存失败：'+e.message}});</script></body></html>
