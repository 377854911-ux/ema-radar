<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/app.css"></head><body><div class="page"><div class="top"><h1>传统金融扫描</h1><span class="muted">独立扫描设置</span></div><p class="muted">Binance TradFi USDT永续合约 · 独立扫描 · 使用原EMA三线信号条件</p><div class="panel"><div style="margin-bottom:12px"><strong>扫描品种（多选）</strong><div id="assetChoices" style="margin-top:8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px"></div></div><div style="margin-bottom:12px"><strong>扫描周期（可多选）</strong><div id="timeframeChoices" style="margin-top:8px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px"></div></div><div class="row" style="align-items:center;margin-bottom:12px"><label style="margin:0;display:flex;align-items:center;gap:6px"><input id="autoScan" type="checkbox" style="width:20px;height:20px;min-height:20px">自动扫描</label><label style="margin:0;display:inline-flex;align-items:center;gap:6px;white-space:nowrap">间隔 <select id="scanInterval" style="width:108px;min-height:34px;height:34px;padding:3px 7px;font-size:14px;line-height:1.2"><option value="5">5分钟</option><option value="10">10分钟</option><option value="15">15分钟</option><option value="30">30分钟</option><option value="60">60分钟</option></select></label></div><div class="row"><button id="scan">开始扫描</button><button id="stop" class="secondary">停止</button><label class="check" style="display:inline-flex;align-items:center;margin:0 0 0 4px;gap:7px"><input id="soundToggle" type="checkbox" style="width:20px;height:20px;min-height:20px">🔔 声音提醒</label><button id="testSound" type="button" class="secondary" style="padding:7px 10px;font-size:13px">试听铃声</button></div><p id="status" class="muted">等待扫描</p><div style="height:9px;background:#0b1220;border-radius:8px;overflow:hidden" role="progressbar" aria-label="扫描进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressTrack"><div id="progressFill" style="height:100%;width:0%;background:#4c9fff;transition:width .15s"></div></div></div><div class="panel"><h3>扫描结果</h3><div id="results" class="muted">尚无结果</div></div></div><script src="../js/tradfi-scanner.js"></script></body></html>
