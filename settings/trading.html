<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../css/app.css"></head><body><div class="page"><div class="top"><h1>自动交易设置</h1><a class="btn secondary" href="../pages/trading.html">返回</a></div><div class="panel"><form id="form"><label>初始统计资金 USDT<input name="initialCapital" type="number" min="1" value="10000"></label><p class="muted">仅保存展示参数，不连接交易所，不启用实盘。</p><button>保存设置</button></form><p id="msg" class="muted"></p></div></div><script>const form=document.querySelector('#form');const k='ema.settings.trading';const old=JSON.parse(localStorage.getItem(k)||'{}');for(const e of form.elements){if(e.name&&old[e.name]!==undefined)e.value=old[e.name]}form.onsubmit=e=>{e.preventDefault();const v={};for(const el of form.elements)if(el.name)v[el.name]=el.value;localStorage.setItem(k,JSON.stringify(v));document.querySelector('#msg').textContent='已保存在当前浏览器';};</script></body></html>
