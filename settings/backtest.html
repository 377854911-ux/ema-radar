<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../css/app.css"><style>body{padding-bottom:90px}h2{font-size:16px;margin:24px 0 12px;color:#a9cbff}fieldset{border:1px solid #35506d;border-radius:10px;margin:14px 0;padding:10px}legend{font-size:14px}.chip{display:inline-flex;align-items:center;gap:5px;background:#1d3450;border-radius:8px;padding:9px;margin:4px;font-size:13px}.check{display:flex;gap:10px;align-items:center}input[type=checkbox]{accent-color:#4c9fff;width:17px;height:17px}input[type=number],select{display:block;width:100%;margin-top:6px}.bar{position:fixed;bottom:0;left:0;right:0;padding:12px;background:#0b1220;border-top:1px solid #304866}.bar button{width:100%}</style></head><body><div class="page"><div class="top"><h1>行情回测设置</h1><a class="btn secondary" href="../pages/backtest.html">返回</a></div><p class="muted">所有参数可独立修改并保存到当前设备。尚未接入的功能只保存配置，不会假装已经生效。</p><form id="form"><h2>回测范围</h2><fieldset><legend>回测周期（可多选）</legend><label class="chip"><input type="checkbox" name="timeframes" value="15m" checked> 15m</label><label class="chip"><input type="checkbox" name="timeframes" value="30m" checked> 30m</label><label class="chip"><input type="checkbox" name="timeframes" value="1h" checked> 1h</label><label class="chip"><input type="checkbox" name="timeframes" value="2h" checked> 2h</label><label class="chip"><input type="checkbox" name="timeframes" value="4h" checked> 4h</label><label class="chip"><input type="checkbox" name="timeframes" value="6h" checked> 6h</label><label class="chip"><input type="checkbox" name="timeframes" value="8h" checked> 8h</label><label class="chip"><input type="checkbox" name="timeframes" value="12h" checked> 12h</label><label class="chip"><input type="checkbox" name="timeframes" value="1d" checked> 1d</label></fieldset><label>历史回测天数<select name="days"><option value="7" >7</option><option value="30" selected>30</option><option value="60" >60</option></select></label><label>历史每日成交额前N<input name="topN" type="number" value="100" min="1" max="300" step="any" required></label><label>24小时涨跌幅过滤(%)<input name="maxMove" type="number" value="30" min="0" max="100" step="any" required></label><h2>入场与仓位</h2><label>入场方式（二选一）<select name="entryMode"><option value="next_open" selected>下一根开盘价</option><option value="offset" >下一根开盘价偏移</option></select></label><label>有利方向偏移(%)<input name="entryOffset" type="number" value="0.5" min="0.5" max="10" step="0.5" required></label><label>回测初始资金(USDT)<input name="initialCapital" type="number" value="10000" min="1" max="100000000" step="any" required></label><label>每笔固定名义金额(USDT)<input name="notional" type="number" value="1000" min="1" max="100000000" step="any" required></label><label>回测杠杆<input name="leverage" type="number" value="1" min="1" max="125" step="any" required></label><label>最大同时持仓及挂单数<input name="maxPositions" type="number" value="5" min="1" max="100" step="any" required></label><h2>止损与止盈</h2><label>止损方式<select name="stopMode"><option value="hard_open" selected>硬止损 + 信号K线开盘价</option><option value="hard_extreme">硬止损 + 信号K线极值（多头最低价 / 空头最高价）</option></select></label><p class="muted">两种止损组合只能单选。每种组合的两个止损条件同时有效，先触及者生效。回测引擎尚未接入，此处仅保存规则。</p><label>硬止损比例（单选，1%–10%）<select name="hardStop"><option value="1" >1%</option><option value="2" selected>2%</option><option value="3" >3%</option><option value="4" >4%</option><option value="5" >5%</option><option value="6" >6%</option><option value="7" >7%</option><option value="8" >8%</option><option value="9" >9%</option><option value="10" >10%</option></select></label><label>固定盈亏比<select name="rr"><option value="0.8" >0.8</option><option value="0.9" >0.9</option><option value="1" selected>1</option><option value="1.1" >1.1</option><option value="1.2" >1.2</option><option value="1.3" >1.3</option><option value="1.4" >1.4</option><option value="1.5" >1.5</option><option value="1.6" >1.6</option><option value="1.7" >1.7</option><option value="1.8" >1.8</option><option value="1.9" >1.9</option><option value="2" >2</option><option value="3" >3</option><option value="4" >4</option><option value="5" >5</option><option value="6" >6</option><option value="7" >7</option><option value="8" >8</option><option value="9" >9</option><option value="10" >10</option></select></label><label>最大持仓K线数<input name="holdCandles" type="number" value="12" min="1" max="100" step="any" required></label><h2>盈亏比与资金费率设置</h2><p class="muted">目标盈亏比在下方「固定盈亏比」选择；资金费率开关在交易成本中。当前历史模拟尚未支持资金费率，试算结果不包含该项成本。</p><label class="check"><input type="checkbox" name="feeOnly" checked> 仅试算（暂不计资金费率，结果非正式回测）</label><h2>交易成本</h2><label>入场手续费(%)<input name="entryFee" type="number" value="0.02" min="0" max="5" step="0.001" required></label><label>止盈手续费(%)<input name="tpFee" type="number" value="0.02" min="0" max="5" step="0.001" required></label><label>止损手续费(%)<input name="slFee" type="number" value="0.05" min="0" max="5" step="0.001" required></label><label>止损不利滑点(%)<input name="slippage" type="number" value="0.05" min="0" max="5" step="0.001" required></label><label class="check"><input type="checkbox" name="funding" checked> 计入资金费率</label><label class="check"><input type="checkbox" name="excludeAmbiguous" checked> 同根K线同时触及止盈止损则排除</label><div class="bar"><button type="submit">保存全部设置</button></div></form><p id="status" role="status"></p></div><script>const k='ema.settings.backtest',form=document.querySelector('#form'),status=document.querySelector('#status');try{const saved=JSON.parse(localStorage.getItem(k)||'{}');if(!['hard_open','hard_extreme'].includes(saved.stopMode))saved.stopMode='hard_open';if(saved.hardStop===undefined&&Array.isArray(saved.hardStops)){saved.hardStop=Number(saved.hardStops.find(v=>Number(v)>=1&&Number(v)<=10)||2)}for(const el of form.querySelectorAll('[name]')){if(!(el.name in saved))continue;if(el.type==='checkbox')el.checked=Array.isArray(saved[el.name])?saved[el.name].includes(el.value):!!saved[el.name];else el.value=saved[el.name]}}catch(e){status.textContent='读取旧设置失败，请重新保存'}const entryMode=form.querySelector('[name=entryMode]'),entryOffset=form.querySelector('[name=entryOffset]');function syncEntry(){entryOffset.disabled=entryMode.value!=='offset'}entryMode.addEventListener('change',syncEntry);syncEntry();form.addEventListener('submit',e=>{e.preventDefault();const data={};for(const el of form.querySelectorAll('[name]')){if(el.type==='checkbox'){if(el.closest('fieldset')){if(!data[el.name])data[el.name]=[];if(el.checked)data[el.name].push(el.value)}else data[el.name]=el.checked}else data[el.name]=el.type==='number'?Number(el.value):el.value}try{if(!Array.isArray(data.timeframes))data.timeframes=[];data.entryOffset=Number(entryOffset.value);delete data.hardStops;localStorage.setItem(k,JSON.stringify(data));status.textContent='已保存 '+new Date().toLocaleString('zh-CN')}catch(e){status.textContent='保存失败：'+e.message}});</script></body></html>
