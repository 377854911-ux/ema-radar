<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EMA雷达">
<title>EMA雷达</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1220;color:#edf3fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);display:grid;place-items:center;background:linear-gradient(160deg,#14233a,#0b1220 62%)}
main{width:min(100%,520px);text-align:center;padding:32px 20px}
.mark{width:66px;height:66px;margin:0 auto 22px;border:1px solid #314765;border-radius:20px;display:grid;place-items:center;background:#172941;color:#9fc2ff;font-size:27px;font-weight:800;letter-spacing:-2px}
h1{font-size:24px;margin:0 0 10px}
p{font-size:14px;line-height:1.7;color:#9aabc0;margin:0}
.line{width:42px;height:3px;border-radius:9px;background:#426fae;margin:24px auto 0}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">EMA</div>
  <h1>EMA 雷达</h1>
  <p>应用外壳已保留。全新版本正在重新搭建。</p>
  <div class="line" aria-hidden="true"></div>
</main>
</body>
</html>
